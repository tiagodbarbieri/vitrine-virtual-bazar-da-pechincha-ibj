name: Deploy and Update PostgreSQL Database

on:
  push:
    branches:
      - deploy_kpis_pgsql

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # --- 1. Checkout code ---
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- 2. Set up Python ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # --- 3. Deploy site via git pull ---
      - name: Deploy site via git pull
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PRIVKEY_FILE: ${{ secrets.SSH_PRIVKEY_FILE}}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PATH_FULL: ${{ secrets.DEPLOY_PATH_FULL }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
            # Check if the .git directory exists
            if [ ! -d "${{ env.DEPLOY_PATH_FULL }}"/.git ]; then
              cd $DEPLOY_PATH
              git clone --branch deploy_kpis_pgsql https://github.com/Projetos-Integradores-Univesp/vitrine-virtual-bazar-da-pechincha-ibj.git
              echo 'Repository cloned successfully.'
            else
              cd $DEPLOY_PATH_FULL
              git fetch --all
              git stash
              git pull --rebase origin deploy_kpis_pgsql
              echo 'Repository updated successfully.'
            fi
      
      # --- 4. Install virtual environment and dependencies ---
      - name: Install virtual environment and dependencies
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PATH_FULL: ${{ secrets.DEPLOY_PATH_FULL }}
        run: |
          cd $DEPLOY_PATH
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r $DEPLOY_PATH_FULL/requirements.txt

      # --- 5. Update environment variables on host ---
      - name: Update environment variables on host
        env:
          RECAPTCHA_PRIVATE_KEY: ${{ secrets.RECAPTCHA_PRIVATE_KEY }}
          RECAPTCHA_PUBLIC_KEY: ${{ secrets.RECAPTCHA_PUBLIC_KEY }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DATABASE: ${{ secrets.POSTGRES_DATABASE }} 
        run: |
          ~/setenv.sh RECAPTCHA_PRIVATE_KEY "${{ env.RECAPTCHA_PRIVATE_KEY }}"
          ~/setenv.sh RECAPTCHA_PUBLIC_KEY "${{ env.RECAPTCHA_PUBLIC_KEY }}"      
          ~/setenv.sh DJANGO_SECRET_KEY "${{ env.DJANGO_SECRET_KEY }}"
          ~/setenv.sh POSTGRES_HOST "${{ env.POSTGRES_HOST }}"
          ~/setenv.sh POSTGRES_USER "${{ env.POSTGRES_USER }}"
          ~/setenv.sh POSTGRES_PASSWORD "${{ env.POSTGRES_PASSWORD }}"
          ~/setenv.sh POSTGRES_DATABASE "${{ env.POSTGRES_DATABASE }}"
          source ~/.bashrc
          ~/updateenv.sh ~/vitrinev2.env RECAPTCHA_PRIVATE_KEY "${{ env.RECAPTCHA_PRIVATE_KEY }}"
          ~/updateenv.sh ~/vitrinev2.env RECAPTCHA_PUBLIC_KEY "${{ env.RECAPTCHA_PUBLIC_KEY }}"      
          ~/updateenv.sh ~/vitrinev2.env DJANGO_SECRET_KEY "${{ env.DJANGO_SECRET_KEY }}"
          ~/updateenv.sh ~/vitrinev2.env POSTGRES_HOST "${{ env.POSTGRES_HOST }}"
          ~/updateenv.sh ~/vitrinev2.env POSTGRES_USER "${{ env.POSTGRES_USER }}"
          ~/updateenv.sh ~/vitrinev2.env POSTGRES_PASSWORD "${{ env.POSTGRES_PASSWORD }}"
          ~/updateenv.sh ~/vitrinev2.env POSTGRES_DATABASE "${{ env.POSTGRES_DATABASE }}"

      
      # --- 5.b Dry-run: inspect SQLite and Postgres (no writes) ---
      - name: "Dry-run: inspect SQLite and Postgres (no writes)"
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PATH_FULL: ${{ secrets.DEPLOY_PATH_FULL }}
          SQLITE_PATH: ${{ secrets.DEPLOY_PATH_FULL }}/prj_vitrine_virtual/db.sqlite3
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DATABASE: ${{ secrets.POSTGRES_DATABASE }}
        run: |
          sudo ~/stopvitrinev2.sh
          
      
      # --- 5.b Dry-run: inspect SQLite and Postgres (no writes) ---
      - name: "Dry-run: inspect SQLite and Postgres (no writes)"
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PATH_FULL: ${{ secrets.DEPLOY_PATH_FULL }}
          SQLITE_PATH: ${{ secrets.DEPLOY_PATH_FULL }}/prj_vitrine_virtual/db.sqlite3
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DATABASE: ${{ secrets.POSTGRES_DATABASE }}
        run: |
          set -e
          cd $DEPLOY_PATH
          # activate venv created in the install step
          if [ -f .venv/bin/activate ]; then
            source .venv/bin/activate
          fi
          python <<'PYCODE'
          import os
          import pandas as pd
          from sqlalchemy import create_engine, inspect, text

          sqlite_path = os.environ.get('SQLITE_PATH')
          pg_user = os.environ.get('POSTGRES_USER')
          pg_password = os.environ.get('POSTGRES_PASSWORD')
          pg_host = os.environ.get('POSTGRES_HOST')
          pg_db = os.environ.get('POSTGRES_DATABASE')

          print('DRY-RUN DEBUG:')
          print('  SQLITE_PATH=', sqlite_path)
          print('  POSTGRES_HOST=', pg_host)
          print('  POSTGRES_DATABASE=', pg_db)

          if not sqlite_path or not os.path.exists(sqlite_path):
              print('SQLite file not found at', sqlite_path)
          else:
              sqlite_engine = create_engine(f"sqlite:///{sqlite_path}")
              with sqlite_engine.connect() as c:
                  tables = [r[0] for r in c.exec_driver_sql("SELECT name FROM sqlite_master WHERE type='table'").fetchall()]
                  print('SQLite tables:', tables)
                  for t in tables:
                      if t == 'sqlite_sequence':
                          continue
                      try:
                          df = pd.read_sql_table(t, c)
                          print(f"  {t}: {len(df)} rows (from SQLite)")
                      except Exception as e:
                          print(f"  Could not read {t} from SQLite: {e}")

          # Check Postgres connection and counts
          try:
              pg_url = f"postgresql+psycopg2://{pg_user}:{pg_password}@{pg_host}/{pg_db}"
              pg_engine = create_engine(pg_url)
              with pg_engine.connect() as c:
                  inspector = inspect(c)
                  pgtables = inspector.get_table_names()
                  print('Postgres tables:', pgtables)
                  for t in pgtables:
                      try:
                          cnt = c.execute(text(f"SELECT COUNT(*) FROM {t}")).scalar()
                          print(f"  {t}: {cnt} rows (in Postgres)")
                      except Exception as e:
                          print(f"  Could not count rows in Postgres table {t}: {e}")
          except Exception as e:
              print('Could not connect to Postgres:', e)
          PYCODE

      # --- 6. Update PostgreSQL database from SQLite (upsert only) ---
      - name: Update PostgreSQL database
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PATH_FULL: ${{ secrets.DEPLOY_PATH_FULL }}
          SQLITE_PATH: ${{ secrets.DEPLOY_PATH_FULL }}/prj_vitrine_virtual/db.sqlite3
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DATABASE: ${{ secrets.POSTGRES_DATABASE }}
        run: |
          pgloader ~/pgloader_vitrinev2_drop

      # --- 7. Run production environment maintenance steps ---
      - name: Run production environment maintenance steps
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PATH_FULL: ${{ secrets.DEPLOY_PATH_FULL }}
        run: |
          cd $DEPLOY_PATH
          python -m venv .venv
          source .venv/bin/activate
          cd $DEPLOY_PATH_FULL/prj_vitrine_virtual
          python manage.py makemigrations
          python manage.py migrate
          python manage.py collectstatic --noinput --verbosity 2
          sudo ~/startvitrinev2.sh
          

        


