name: Deploy and Update MySQL Database

on:
  push:
    branches:
      - deploy_kpis

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # --- 1. Checkout code ---
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- 2. Set up Python ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --- 3. Deploy site via git pull ---
      - name: Deploy site via git pull
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PRIVKEY_FILE: ${{ secrets.SSH_PRIVKEY_FILE}}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PATH_FULL: ${{ secrets.DEPLOY_PATH_FULL }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
            # Check if the .git directory exists
            if [ ! -d "${{ env.DEPLOY_PATH_FULL }}"/.git ]; then
              cd $DEPLOY_PATH
              git clone --branch deploy_kpis https://github.com/Projetos-Integradores-Univesp/vitrine-virtual-bazar-da-pechincha-ibj.git
              echo 'Repository cloned successfully.'
            else
              cd $DEPLOY_PATH_FULL
              git fetch --all
              git stash
              git pull --rebase origin deploy_kpis
              echo 'Repository updated successfully.'
            fi
      
      # --- 4. Install virtual environment and dependencies ---
      - name: Install virtual environment and dependencies
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PATH_FULL: ${{ secrets.DEPLOY_PATH_FULL }}
        run: |
          cd $DEPLOY_PATH
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r $DEPLOY_PATH_FULL/requirements.txt

      # --- 5. Update environment variables on host ---
      - name: Update environment variables on host
        env:
          RECAPTCHA_PRIVATE_KEY: ${{ secrets.RECAPTCHA_PRIVATE_KEY }}
          RECAPTCHA_PUBLIC_KEY: ${{ secrets.RECAPTCHA_PUBLIC_KEY }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }} 
        run: |
          ~/setenv.sh RECAPTCHA_PRIVATE_KEY "${{ env.RECAPTCHA_PRIVATE_KEY }}"
          ~/setenv.sh RECAPTCHA_PUBLIC_KEY "${{ env.RECAPTCHA_PUBLIC_KEY }}"      
          ~/setenv.sh DJANGO_SECRET_KEY "${{ env.DJANGO_SECRET_KEY }}"
          ~/setenv.sh MYSQL_HOST "${{ env.MYSQL_HOST }}"
          ~/setenv.sh MYSQL_USER "${{ env.MYSQL_USER }}"
          ~/setenv.sh MYSQL_PASSWORD "${{ env.MYSQL_PASSWORD }}"
          ~/setenv.sh MYSQL_DATABASE "${{ env.MYSQL_DATABASE }}"
          source ~/.bashrc
          ~/updateenv.sh ~/vitrinev2.env RECAPTCHA_PRIVATE_KEY "${{ env.RECAPTCHA_PRIVATE_KEY }}"
          ~/updateenv.sh ~/vitrinev2.env RECAPTCHA_PUBLIC_KEY "${{ env.RECAPTCHA_PUBLIC_KEY }}"      
          ~/updateenv.sh ~/vitrinev2.env DJANGO_SECRET_KEY "${{ env.DJANGO_SECRET_KEY }}"
          ~/updateenv.sh ~/vitrinev2.env MYSQL_HOST "${{ env.MYSQL_HOST }}"
          ~/updateenv.sh ~/vitrinev2.env MYSQL_USER "${{ env.MYSQL_USER }}"
          ~/updateenv.sh ~/vitrinev2.env MYSQL_PASSWORD "${{ env.MYSQL_PASSWORD }}"
          ~/updateenv.sh ~/vitrinev2.env MYSQL_DATABASE "${{ env.MYSQL_DATABASE }}"

      # --- 6. Update MySQL database from SQLite ---
      - name: Update MySQL database
        env:
          SQLITE_PATH: ${{ secrets.DEPLOY_PATH_FULL }}/prj_vitrine_virtual/db.sqlite3
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
        run: |
          python <<'PYCODE'
          import pandas as pd
          from sqlalchemy import create_engine

          sqlite_path = "${{ env.SQLITE_PATH }}"
          sqlite_engine = create_engine(f"sqlite:///{sqlite_path}")

          mysql_engine = create_engine(
              f"mysql+pymysql://{ '${{ env.MYSQL_USER }}' }:{ '${{ env.MYSQL_PASSWORD }}' }@{ '${{ env.MYSQL_HOST }}' }/{ '${{ env.MYSQL_DATABASE }}' }"
          )

          with sqlite_engine.connect() as conn_sqlite:
              for table_name in conn_sqlite.exec_driver_sql("SELECT name FROM sqlite_master WHERE type='table'").fetchall():
                  if table_name[0] == 'sqlite_sequence':
                      continue  # Skip SQLite internal table
                  tname = table_name[0]
                  print(f"Transferring table: {tname}")
                  df = pd.read_sql_table(tname, conn_sqlite)
                  df.to_sql(tname, mysql_engine, if_exists='replace', index=False)
          PYCODE

      # --- 7. Run production environment maintenance steps ---
      - name: Run production environment maintenance steps
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PATH_FULL: ${{ secrets.DEPLOY_PATH_FULL }}
        run: |
          cd $DEPLOY_PATH
          python -m venv .venv
          source .venv/bin/activate
          cd $DEPLOY_PATH_FULL/prj_vitrine_virtual
          python manage.py makemigrations
          python manage.py migrate
          python manage.py collectstatic --noinput --verbosity 2
          sudo ~/reloadvitrinev2.sh
          

        


